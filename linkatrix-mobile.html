<script>
// ==========================================================================
// LINKATRIX Mobile — Mock data + rule-based engines
// Structured to mirror /services/marketApi.js + /services/recommendationEngine.js
// described in the spec, so real Agmarknet/eNAM + weather APIs can be
// dropped in later via environment variables without changing the UI.
// ==========================================================================
(function(){
  const MARKET_API_CONFIGURED = false; // legacy flag — Home/Weather still use demo data
  const WEATHER_API_CONFIGURED = false; // set true once WEATHER_API_URL is live

  // ------------------------------------------------------------------------
  // REAL market data — data.gov.in "Current Daily Price of Various
  // Commodities from Various Markets (Mandi)" (Agmarknet-sourced, Ministry
  // of Agriculture & Farmers Welfare). This is a genuine government API,
  // called directly from the browser — no backend proxy in this prototype.
  //   Resource: 9ef84268-d588-465a-a308-a864a43d0070
  //   Docs: https://www.data.gov.in/catalog/current-daily-price-various-commodities-various-markets-mandi
  // Because this file has no server, the request goes straight from your
  // browser to api.data.gov.in. If that response doesn't carry a CORS
  // header allowing your origin, the browser will block it — the app
  // detects this (or any network failure) and falls back to demo data
  // rather than crashing or silently pretending to be live.
  // ------------------------------------------------------------------------
  const MARKET_API_BASE = 'https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070';
  // Public sample key published by data.gov.in for testing — shared by
  // everyone, so it is heavily rate-limited. Register your own free key at
  // https://www.data.gov.in (Sign Up → My Account → API key) and set it
  // from the app's Profile → Data Source Settings screen for reliable use.
  const DEFAULT_SAMPLE_KEY = '579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b';

  function getMarketApiKey(){
    try { return localStorage.getItem('linkatrix_market_api_key') || DEFAULT_SAMPLE_KEY; }
    catch(e){ return DEFAULT_SAMPLE_KEY; }
  }
  function setMarketApiKey(key){
    try { localStorage.setItem('linkatrix_market_api_key', key || ''); } catch(e){}
  }
  function usingDefaultKey(){ return getMarketApiKey() === DEFAULT_SAMPLE_KEY; }

  const INDIAN_STATES = ['Haryana','Punjab','Uttar Pradesh','NCT of Delhi','Rajasthan','Madhya Pradesh','Maharashtra','Gujarat','Karnataka','Bihar'];

  // Maps our internal crop ids to the exact commodity spelling Agmarknet
  // publishes, since the government field names are not standardised and
  // must match exactly for the filter to work.
  const AGMARKNET_COMMODITY = { tomato:'Tomato', onion:'Onion', potato:'Potato', wheat:'Wheat', rice:'Rice', mustard:'Mustard' };

  async function fetchLiveMandiPrices({ state='Haryana', cropId='tomato', limit=100 }){
    const commodity = AGMARKNET_COMMODITY[cropId];
    if(!commodity) throw new Error('Unsupported commodity for live lookup');
    const url = `${MARKET_API_BASE}?api-key=${encodeURIComponent(getMarketApiKey())}&format=json&limit=${limit}&filters[state]=${encodeURIComponent(state)}&filters[commodity]=${encodeURIComponent(commodity)}`;
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 12000);
    let res;
    try {
      res = await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timeout);
    }
    if(!res.ok) throw new Error('Agmarknet API returned status '+res.status);
    const json = await res.json();
    const records = Array.isArray(json.records) ? json.records : [];
    if(records.length === 0) throw new Error('No live records for this state/commodity combination');

    // Normalize to the format described in the spec: crop, variety, mandi,
    // district, state, arrivalDate, minPrice, maxPrice, modalPrice
    const normalized = records.map(r => ({
      crop: r.commodity, variety: r.variety, mandi: r.market, district: r.district, state: r.state,
      arrivalDate: r.arrival_date, // government format is DD/MM/YYYY
      minPrice: Number(r.min_price)||0, maxPrice: Number(r.max_price)||0, modalPrice: Number(r.modal_price)||0,
    })).filter(r => r.modalPrice > 0);

    // Keep only the latest record per market (the dataset can list a market
    // more than once across nearby dates).
    const byMarket = {};
    normalized.forEach(r=>{
      const key = r.mandi;
      if(!byMarket[key] || parseDDMMYYYY(r.arrivalDate) > parseDDMMYYYY(byMarket[key].arrivalDate)){
        byMarket[key] = r;
      }
    });
    const mandiList = Object.values(byMarket).sort((a,b)=>b.modalPrice-a.modalPrice);

    // Build a short real trend if the pull happened to span multiple dates.
    const byDate = {};
    normalized.forEach(r=>{
      const d = r.arrivalDate;
      if(!byDate[d]) byDate[d] = [];
      byDate[d].push(r.modalPrice);
    });
    const dateKeys = Object.keys(byDate).sort((a,b)=>parseDDMMYYYY(a)-parseDDMMYYYY(b));
    const trendSeries = dateKeys.map(d=>{
      const vals = byDate[d];
      const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
      const parts = d.split('/');
      const iso = parts.length===3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : d;
      const label = parts.length===3 ? `${parts[0]} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(parts[1])-1]}` : d;
      return { date: iso, label, price: avg };
    });

    return { mandiList, trendSeries, fetchedAt: new Date().toISOString(), raw: normalized };
  }
  function parseDDMMYYYY(s){
    if(!s) return 0;
    const [d,m,y] = s.split('/').map(Number);
    return new Date(y,(m||1)-1,d||1).getTime();
  }

  function seedSeries(base, days, drift, noise, seed){
    const out = []; let v = base;
    const today = new Date(2026,8,12);
    for(let i=days-1;i>=0;i--){
      v = v + drift + Math.sin((i+seed)/3)*noise + (((i*37+seed)%7)-3)*1.6;
      const d = new Date(today); d.setDate(d.getDate()-i);
      out.push({ date: d.toISOString().slice(0,10), label: d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}), price: Math.max(50,Math.round(v)) });
    }
    return out;
  }

  const CROPS = [
    { id:'tomato', name:'Tomato', nameHi:'टमाटर', unit:'Quintal', history: seedSeries(2350,90,4.6,26,1) },
    { id:'onion', name:'Onion', nameHi:'प्याज', unit:'Quintal', history: seedSeries(2200,90,-3.1,30,2) },
    { id:'potato', name:'Potato', nameHi:'आलू', unit:'Quintal', history: seedSeries(1450,90,1.4,14,3) },
    { id:'wheat', name:'Wheat', nameHi:'गेहूं', unit:'Quintal', history: seedSeries(2410,90,2.9,12,4) },
    { id:'rice', name:'Rice', nameHi:'चावल', unit:'Quintal', history: seedSeries(3120,90,1.1,20,5) },
    { id:'mustard', name:'Mustard', nameHi:'सरसों', unit:'Quintal', history: seedSeries(5480,90,-2.4,38,6) },
  ];

  const MANDIS = [
    { id:'m1', name:'Azadpur Mandi', distanceKm:18, trend:4.8 },
    { id:'m2', name:'Gurgaon Mandi', distanceKm:32, trend:2.1 },
    { id:'m3', name:'Panipat Mandi', distanceKm:55, trend:-1.2 },
    { id:'m4', name:'Sonipat Mandi', distanceKm:41, trend:1.0 },
  ];

  function mandiPriceFor(cropId, mandi){
    const crop = CROPS.find(c=>c.id===cropId) || CROPS[0];
    const base = crop.history[crop.history.length-1].price;
    const adj = { m1:1.03, m2:1.0, m3:0.975, m4:1.008 }[mandi.id] || 1;
    return Math.round(base*adj);
  }

  const BUYERS = [
    { id:'b1', name:'Sharma Agro Traders', distanceKm:2.8, trustScore:92, verified:true, interestedIn:'Tomato', qty:100,
      transactions:148, rating:4.7, disputeRate:1.3, breakdown:{ identity:20, transactions:28, payment:24, ratings:20 } },
    { id:'b2', name:'FreshFarm Foods', distanceKm:5.8, trustScore:87, verified:true, interestedIn:'Vegetables', qty:80,
      transactions:96, rating:4.4, disputeRate:2.4, breakdown:{ identity:20, transactions:24, payment:22, ratings:21 } },
    { id:'b3', name:'GreenBasket Procurement', distanceKm:8.1, trustScore:95, verified:true, interestedIn:'Tomato, Onion', qty:150,
      transactions:210, rating:4.8, disputeRate:0.8, breakdown:{ identity:20, transactions:29, payment:25, ratings:21 } },
  ];

  const KNOWLEDGE_CATEGORIES = [
    { id:'fertilizers', icon:'sprout', title:'Fertilizers', titleHi:'उर्वरक' },
    { id:'chemicals', icon:'flask', title:'Chemicals', titleHi:'रसायन' },
    { id:'pesticides', icon:'bug', title:'Pesticides', titleHi:'कीटनाशक' },
    { id:'irrigation', icon:'droplet', title:'Irrigation', titleHi:'सिंचाई' },
    { id:'cropmgmt', icon:'leaf', title:'Crop Management', titleHi:'फसल प्रबंधन' },
    { id:'weatherknow', icon:'cloud', title:'Weather', titleHi:'मौसम' },
    { id:'marketknow', icon:'trendUp', title:'Market Knowledge', titleHi:'बाज़ार जानकारी' },
  ];

  const FERTILIZERS = [
    { name:'Nitrogen Fertilizers', what:'Promote leafy green growth and are key during the vegetative stage.', when:'Generally used early in the crop cycle, split across 2–3 doses.', caution:'Over-application can delay flowering and increase pest susceptibility.' },
    { name:'Phosphorus Fertilizers', what:'Support root development and early plant establishment.', when:'Typically applied as a basal dose at sowing/transplanting.', caution:'Excess phosphorus can lock out micronutrients like zinc.' },
    { name:'Potassium Fertilizers', what:'Improve fruit quality, disease resistance and water regulation.', when:'Often applied during flowering and fruiting stages.', caution:'Should be balanced with soil-test recommendations for your field.' },
    { name:'Organic Fertilizers', what:'Improve long-term soil health, structure and microbial activity.', when:'Best applied well before sowing to allow decomposition.', caution:'Ensure compost/manure is fully decomposed to avoid pathogens.' },
  ];

  const PESTICIDES = [
    { category:'Insecticides', purpose:'Target sap-sucking and leaf-eating insects.', crops:'Vegetables, cotton, cereals', safety:'Use recommended protective equipment; observe pre-harvest interval.' },
    { category:'Fungicides', purpose:'Control fungal infections such as blight and mildew.', crops:'Tomato, potato, grapes', safety:'Avoid spraying before rain; rotate active ingredients to prevent resistance.' },
    { category:'Herbicides', purpose:'Manage weed competition in field crops.', crops:'Wheat, rice, sugarcane', safety:'Apply at the correct crop growth stage to avoid crop injury.' },
  ];

  const AFTER_HARVEST = {
    wheat: [
      { crop:'Moong', water:'Low', season:'Zaid (Summer)', demand:'Moderate–High', cycle:'~60–65 days' },
      { crop:'Vegetables (seasonal)', water:'Medium', season:'Zaid/Kharif', demand:'High', cycle:'~60–90 days' },
      { crop:'Mustard', water:'Low', season:'Rabi (next cycle)', demand:'Moderate', cycle:'~110–140 days' },
    ],
  };

  const WHAT_TO_GROW_POOL = [
    { crop:'Tomato', reason:'Good market demand and suits moderate water availability.' },
    { crop:'Onion', reason:'Stores well and has steady mandi demand through the season.' },
    { crop:'Mustard', reason:'Low water requirement, suitable for the upcoming Rabi season.' },
  ];

  const DEMO_ACCOUNTS = {
    farmer: { name:'Ramesh Kumar', role:'FARMER', phone:'9876543210', location:'Haryana', mandi:'Azadpur Mandi', crop:'tomato', quantity:20 },
    buyer:  { name:'Sharma Agro Traders', role:'BUYER', phone:'9876500004', location:'Delhi NCR', businessName:'Sharma Agro Traders', category:'Wholesaler' },
  };

  // Crop listings posted by farmers — this is what a Buyer browses.
  const FARMER_LISTINGS = [
    { id:'L2001', cropId:'tomato', farmer:'Ramesh Kumar', farmerTrust:88, quantity:20, unit:'Quintal', quality:'Good', expectedPrice:2450, location:'Sonipat, Haryana', distanceKm:6.2, createdAt:'2026-09-10' },
    { id:'L2002', cropId:'onion', farmer:'Sita Devi', farmerTrust:91, quantity:35, unit:'Quintal', quality:'Excellent', expectedPrice:2180, location:'Rohtak, Haryana', distanceKm:14.5, createdAt:'2026-09-11' },
    { id:'L2003', cropId:'wheat', farmer:'Gurpreet Singh', farmerTrust:95, quantity:60, unit:'Quintal', quality:'Excellent', expectedPrice:2500, location:'Karnal, Haryana', distanceKm:22.0, createdAt:'2026-09-09' },
    { id:'L2004', cropId:'potato', farmer:'Manoj Yadav', farmerTrust:76, quantity:15, unit:'Quintal', quality:'Average', expectedPrice:1420, location:'Panipat, Haryana', distanceKm:9.8, createdAt:'2026-09-11' },
    { id:'L2005', cropId:'mustard', farmer:'Ramesh Kumar', farmerTrust:88, quantity:10, unit:'Quintal', quality:'Good', expectedPrice:5420, location:'Sonipat, Haryana', distanceKm:6.2, createdAt:'2026-09-08' },
  ];

  function recommendationEngine(cropId){
    // RecommendationEngine -> RuleBasedEngine (see /services/recommendationEngine.js)
    // ML forecasting can be integrated after sufficient historical data is available.
    const crop = CROPS.find(c=>c.id===cropId) || CROPS[0];
    const h = crop.history;
    const last7 = h.slice(-7);
    const trendPct = Number((((last7[last7.length-1].price - last7[0].price) / last7[0].price) * 100).toFixed(1));
    const movingAvg = Math.round(h.slice(-7).reduce((a,d)=>a+d.price,0)/7);
    const nearbyPositive = MANDIS.filter(m=>m.trend>0).length;
    const nearbyTrendPositive = nearbyPositive >= MANDIS.length/2;
    let recommendation = 'COMPARE_MANDIS';
    if (trendPct > 2.5 && nearbyTrendPositive) recommendation = 'WAIT';
    else if (trendPct < -2.5) recommendation = 'SELL_NOW';
    const current = h[h.length-1].price;
    const expectedChangePct = recommendation==='WAIT' ? Math.max(1.5, Math.min(5, trendPct*0.85)) : recommendation==='SELL_NOW' ? -Math.abs(trendPct*0.3) : 0.8;
    const expected = Math.round(current*(1+expectedChangePct/100));
    const confidence = Math.min(92, Math.round(55 + Math.abs(trendPct)*4));
    return {
      cropId, cropName: crop.name, current, expected, diffPerUnit: expected-current,
      trendPct, movingAvg, nearbyTrendPositive, nearbyPositive, totalMandis: MANDIS.length,
      recommendation, confidence,
      factors: [
        { label:'Recent 7-day trend', value: trendPct>=0?'↑ Positive':'↓ Negative', positive: trendPct>=0 },
        { label:'Nearby mandi trend', value: nearbyTrendPositive?'↑ Positive':'↓ Mixed', positive: nearbyTrendPositive },
        { label:'Current price', value: `₹${current}`, positive:null },
        { label:'Historical pattern', value: trendPct>=0?'↑ Positive':'↓ Negative', positive: trendPct>=0 },
      ],
    };
  }

  function weatherEngine(){
    // Demo weather — swap for a real fetch to WEATHER_API_URL when configured.
    return { tempC:28, rainProb:60, windKmh:12, humidity:72, condition:'Partly cloudy with chance of rain', configured: WEATHER_API_CONFIGURED };
  }

  function farmTipFromWeather(w){
    if (w.rainProb >= 50) {
      return { icon:'cloudRain', title:"Avoid applying fertilizer today", reason:'Rain may wash away nutrients before they are effectively absorbed.', badge:'WEATHER-BASED TIP', priority:'High', expected:'Rain likely this afternoon', action:'Delay fertilizer application by 1–2 days' };
    }
    return { icon:'sun', title:'Good conditions for field work', reason:'No significant rain expected — a suitable window for fertilizer or spraying, subject to label instructions.', badge:'WEATHER-BASED TIP', priority:'Normal', expected:'Clear conditions expected', action:'Proceed as planned' };
  }

  window.LINKATRIX = {
    MARKET_API_CONFIGURED, WEATHER_API_CONFIGURED,
    CROPS, MANDIS, BUYERS, KNOWLEDGE_CATEGORIES, FERTILIZERS, PESTICIDES, AFTER_HARVEST, WHAT_TO_GROW_POOL, DEMO_ACCOUNTS,
    mandiPriceFor, recommendationEngine, weatherEngine, farmTipFromWeather,
    getListings: (function(){ let L=[]; return { get:()=>L, add:(l)=>{L=[l,...L]; return l;} }; })(),
    FARMER_LISTINGS,
    getOffers: (function(){ let O=[]; return { get:()=>O, add:(o)=>{O=[o,...O]; return o;} }; })(),
    INDIAN_STATES, AGMARKNET_COMMODITY,
    fetchLiveMandiPrices, getMarketApiKey, setMarketApiKey, usingDefaultKey, DEFAULT_SAMPLE_KEY,
  };
})();
</script>

<script type="text/babel" data-presets="react">
function StockChart({ data, width=380, height=190, color="#2F9E6E" }){
  const pad = { l:38, r:10, t:14, b:22 };
  const vals = data.map(d=>d.price);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const innerW = width-pad.l-pad.r, innerH = height-pad.t-pad.b;
  const pts = data.map((d,i)=>{
    const x = pad.l + (data.length===1?0:(i/(data.length-1))*innerW);
    const y = pad.t + innerH - ((d.price-min)/range)*innerH;
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?`M ${p[0]} ${p[1]}`:`L ${p[0]} ${p[1]}`)).join(' ');
  const areaPath = `${path} L ${pts[pts.length-1][0]} ${pad.t+innerH} L ${pts[0][0]} ${pad.t+innerH} Z`;
  const [hover, setHover] = React.useState(data.length-1);
  const h = hover!=null ? hover : data.length-1;
  const rising = data[data.length-1].price >= data[0].price;
  const gid = 'g'+Math.random().toString(36).slice(2,8);
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto touch-none"
      onMouseLeave={()=>setHover(data.length-1)}
      onTouchMove={e=>{
        const rect = e.target.closest('svg').getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        const ratio = Math.max(0,Math.min(1,(x*(width/rect.width)-pad.l)/innerW));
        setHover(Math.round(ratio*(data.length-1)));
      }}
      onMouseMove={e=>{
        const rect = e.target.closest('svg').getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = Math.max(0,Math.min(1,(x*(width/rect.width)-pad.l)/innerW));
        setHover(Math.round(ratio*(data.length-1)));
      }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={rising?'#2F9E6E':'#C4432F'} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={rising?'#2F9E6E':'#C4432F'} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0,1,2,3].map(i=>{
        const y = pad.t + (innerH/3)*i;
        const val = Math.round(max-(range/3)*i);
        return <g key={i}><line x1={pad.l} x2={width-pad.r} y1={y} y2={y} stroke="#F0F3F0" strokeWidth="1"/><text x={2} y={y+3} fontSize="9" fill="#AAB6AE">{val}</text></g>;
      })}
      <path d={areaPath} fill={`url(#${gid})`} />
      <path d={path} fill="none" stroke={rising?'#2F9E6E':'#C4432F'} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/>
      {pts[h] && <line x1={pts[h][0]} x2={pts[h][0]} y1={pad.t} y2={pad.t+innerH} stroke="#AAB6AE" strokeDasharray="3,3" strokeWidth="1"/>}
      {pts[h] && <circle cx={pts[h][0]} cy={pts[h][1]} r="4" fill={rising?'#2F9E6E':'#C4432F'} stroke="#fff" strokeWidth="2"/>}
      {pts[h] && (
        <g>
          <rect x={Math.min(Math.max(pts[h][0]-46,2),width-94)} y={2} width="92" height="30" rx="7" fill="#14201A" opacity="0.94"/>
          <text x={Math.min(Math.max(pts[h][0]-40,8),width-88)} y={14} fontSize="9" fill="#AAB6AE">{data[h].label}</text>
          <text x={Math.min(Math.max(pts[h][0]-40,8),width-88)} y={26} fontSize="12" fontWeight="800" fill="#fff">₹{data[h].price.toLocaleString('en-IN')}</text>
        </g>
      )}
    </svg>
  );
}
</script>

function PriceTrendScreen({ setView, params, online }){
  const DB = window.LINKATRIX;
  const t = useT();
  const [cropId, setCropId] = React.useState(params?.crop || 'tomato');
  const [state, setState] = React.useState('Haryana');
  const [range, setRange] = React.useState('30D');
  const [query, setQuery] = React.useState('');
  const [infoOpen, setInfoOpen] = React.useState(false);
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const [status, setStatus] = React.useState('loading'); // loading | live | error
  const [live, setLive] = React.useState(null);
  const [errorMsg, setErrorMsg] = React.useState('');
  const crop = DB.CROPS.find(c=>c.id===cropId);

  const runFetch = React.useCallback(() => {
    if(!online){ setStatus('error'); setErrorMsg('You are offline.'); return; }
    setStatus('loading');
    DB.fetchLiveMandiPrices({ state, cropId, limit: 100 })
      .then(result => { setLive(result); setStatus('live'); })
      .catch(err => { setLive(null); setStatus('error'); setErrorMsg(err.message || 'Could not reach the live API'); });
  }, [state, cropId, online]);

  React.useEffect(() => { runFetch(); }, [runFetch]);

  const isLive = status==='live' && live;
  const liveAvgModal = isLive ? Math.round(live.mandiList.reduce((a,m)=>a+m.modalPrice,0)/live.mandiList.length) : null;
  const hasLiveTrend = isLive && live.trendSeries.length >= 2;

  const rangeDays = { '1D':2, '7D':7, '30D':30, '90D':90 }[range];
  const demoData = crop.history.slice(-rangeDays);
  const chartData = hasLiveTrend ? live.trendSeries : demoData;
  const current = isLive ? liveAvgModal : demoData[demoData.length-1].price;
  const prevRef = hasLiveTrend ? live.trendSeries[live.trendSeries.length-2].price : demoData[demoData.length-2]?.price;
  const pct = prevRef ? (((current-prevRef)/prevRef)*100).toFixed(1) : null;
  const up = pct!==null && pct>0, flat = pct!==null && Math.abs(pct)<0.05;
  const filtered = DB.CROPS.filter(c=> c.name.toLowerCase().includes(query.toLowerCase()) || c.nameHi.includes(query));
  const topMandi = isLive ? live.mandiList[0] : null;

  return (
    <div className="h-full flex flex-col">
      <TopBar title={t('priceTrend')} onBack={()=>setView('home')} right={
        <div className="flex items-center gap-2">
          <Badge tone={isLive?'live':status==='loading'?'neutral':'demo'}>
            {status==='loading' ? '⏳ Checking…' : isLive ? '🟢 '+t('liveData') : '🟡 '+t('demoData')}
          </Badge>
          <button onClick={()=>setSettingsOpen(true)} className="w-7 h-7 rounded-full bg-ink-900/5 flex items-center justify-center text-ink-700"><Icon name="settings" size={14}/></button>
        </div>
      } />
      <div className="flex-1 scroll-area pb-8">
        <OfflineBanner online={online} />
        <div className="px-5 pt-4 text-xs text-ink-500">Live mandi prices from data.gov.in (Agmarknet).</div>

        {status==='error' && (
          <div className="mx-5 mt-3 rounded-2xl bg-amber-100 text-amber-700 px-4 py-3 fade-up">
            <div className="flex items-start gap-2">
              <Icon name="alertTriangle" size={16} className="mt-0.5 shrink-0"/>
              <div className="text-xs leading-relaxed">
                <b>⚠️ Market data temporarily unavailable.</b> {errorMsg} This is usually a CORS restriction (this file has no backend server to proxy the request) or the shared sample key being rate-limited. Showing demo data below.
              </div>
            </div>
            <div className="flex gap-2 mt-2.5">
              <Button size="sm" variant="soft" onClick={runFetch}><Icon name="refresh" size={13}/> Retry</Button>
              <Button size="sm" variant="ghost" onClick={()=>setSettingsOpen(true)}>Check API Key</Button>
            </div>
          </div>
        )}

<script type="text/babel" data-presets="react">
// ==========================================================================
// ADD CROP flow + success screen
// ==========================================================================
function AddCropScreen({ setView, user }){
  const DB = window.LINKATRIX;
  const toast = useToast();
  const [form, setForm] = React.useState({ crop:'tomato', quantity:'', quality:'Good' });
  const [image, setImage] = React.useState(null);
  const [progress, setProgress] = React.useState(0);
  const inputRef = React.useRef();
  const set = (k,v)=>setForm(f=>({...f,[k]:v}));

  const handleFile = (files) => {
    const f = files[0]; if(!f) return;
    const reader = new FileReader();
    let p=10; setProgress(10);
    const timer = setInterval(()=>{p+=30; setProgress(Math.min(p,95)); if(p>=95) clearInterval(timer);}, 100);
    reader.onload = e => { setProgress(100); setTimeout(()=>{setImage(e.target.result); setProgress(0);},250); };
    reader.readAsDataURL(f);
  };

  const submit = () => {
    if(!form.quantity){ toast('Enter quantity','error'); return; }
    const listing = { id:'L'+Math.floor(1000+Math.random()*9000), cropId: form.crop, quantity: Number(form.quantity), quality: form.quality, image, createdAt:new Date().toISOString().slice(0,10) };
    DB.getListings.add(listing);
    setView('add-success', { listing });
  };

  return (
    <div className="h-full flex flex-col">
      <TopBar title="Add Your Crop" onBack={()=>setView('home')} />
      <div className="flex-1 scroll-area px-5 py-5 pb-8">
        <div>
          <label className="text-xs font-bold text-ink-500">Crop</label>
          <select value={form.crop} onChange={e=>set('crop',e.target.value)} className="w-full mt-1 px-4 py-3 rounded-2xl border border-ink-900/10 bg-white text-[15px]">
            {DB.CROPS.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            <option value="other">Other</option>
          </select>
        </div>
        <div className="mt-3">
          <label className="text-xs font-bold text-ink-500">Quantity (Quintals)</label>
          <input type="number" value={form.quantity} onChange={e=>set('quantity',e.target.value)} placeholder="e.g. 20"
            className="w-full mt-1 px-4 py-3 rounded-2xl border border-ink-900/10 bg-white text-[15px]" />
        </div>
        <div className="mt-3">
          <label className="text-xs font-bold text-ink-500">Quality</label>
          <div className="grid grid-cols-4 gap-2 mt-1.5">
            {['Excellent','Good','Average','Poor'].map(q=>(
              <button key={q} onClick={()=>set('quality',q)} className={`py-2.5 rounded-xl text-[12px] font-bold border-2 ${form.quality===q?'border-forest-700 bg-forest-50 text-forest-700':'border-ink-900/10 text-ink-500'}`}>{q}</button>
            ))}
          </div>
        </div>
        <div className="mt-5">
          <label className="text-xs font-bold text-ink-500">Add Crop Photo (Optional)</label>
          <div onClick={()=>inputRef.current.click()} className="mt-1.5 rounded-2xl border-2 border-dashed border-ink-900/15 bg-white p-5 text-center">
            <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={e=>handleFile(e.target.files)} />
            {image ? <img src={image} className="max-h-32 mx-auto rounded-xl object-cover"/> : (
              <>
                <Icon name="camera" size={22} className="mx-auto text-ink-300"/>
                <div className="text-sm font-bold text-ink-700 mt-2">📷 Upload Photo</div>
                <div className="text-[11px] text-ink-300 mt-1">Photo is optional and currently used only for listing/reference.</div>
              </>
            )}
            {progress>0 && <div className="w-full h-1.5 bg-ink-900/10 rounded-full mt-3 overflow-hidden"><div className="h-full bg-forest-700 transition-all" style={{width:`${progress}%`}}/></div>}
          </div>
        </div>
        <Card className="mt-5 flex items-center justify-between">
          <div className="flex items-center gap-2 text-sm">
            <Icon name="mapPin" size={16} className="text-forest-700"/>
            <div><div className="font-bold text-ink-900">{user.location||'Haryana'}</div><div className="text-xs text-ink-500">Mandi: {user.mandi||'Azadpur Mandi'}</div></div>
          </div>
          <button className="text-forest-700 text-xs font-bold">Change</button>
        </Card>
        <Button className="w-full mt-6" size="lg" onClick={submit}>Add Crop</Button>
      </div>
    </div>
  );
}

function AddCropSuccessScreen({ setView, params }){
  const DB = window.LINKATRIX;
  const listing = params?.listing;
  const crop = DB.CROPS.find(c=>c.id===listing?.cropId) || DB.CROPS[0];
  return (
    <div className="h-full flex flex-col items-center justify-center px-8 text-center">
      <div className="w-20 h-20 rounded-full bg-forest-100 text-forest-700 flex items-center justify-center pop-in">
        <Icon name="check" size={36} strokeWidth={2.5}/>
      </div>
      <div className="font-extrabold text-xl text-ink-900 mt-5">✓ Crop Added Successfully</div>
      <div className="mt-3 text-lg font-bold text-ink-900">{crop.name}</div>
      <div className="text-ink-500 text-sm">{listing?.quantity} Quintals</div>
      <Button className="w-full mt-8" size="lg" onClick={()=>setView('recommendation',{crop:crop.id, quantity:listing?.quantity})}>Get Recommendation <Icon name="arrowRight" size={16}/></Button>
      <button onClick={()=>setView('home')} className="text-ink-500 font-semibold text-sm mt-4">Back to Home</button>

}
</script>
<script type="text/babel" data-presets="react">
// ==========================================================================
// RECOMMENDATION — the core LINKATRIX feature
// ==========================================================================
function ExplainSheet({ open, onClose, r }){
  return (
    <BottomSheet open={open} onClose={onClose} title={`Why are we recommending ${r.recommendation.replace('_',' ')}?`}>
      <div className="space-y-2.5 pb-2">
        {r.factors.map(f=>(
          <div key={f.label} className="flex items-center justify-between text-sm py-1.5 border-b border-ink-900/[0.05] last:border-0">
            <span className="text-ink-500">{f.label}</span>
            <span className={`font-bold ${f.positive===true?'text-forest-700':f.positive===false?'text-red-600':'text-ink-900'}`}>{f.value}</span>
          </div>
        ))}
        <div className="flex items-center justify-between pt-2">
          <span className="text-ink-700 font-bold text-sm">Recommendation confidence</span>
          <span className="font-extrabold text-forest-700">{r.confidence}%</span>
        </div>
        <div className="w-full h-2 bg-ink-900/5 rounded-full overflow-hidden"><div className="h-full bg-forest-700" style={{width:`${r.confidence}%`}}/></div>
        <Badge tone="neutral" className="mt-2">Rule-Based Prototype</Badge>
      </div>
    </BottomSheet>
  );
}

function RecommendationScreen({ setView, params, user }){
  const DB = window.LINKATRIX;
  const t = useT();
  const cropId = params?.crop || user.crop || 'tomato';
  const quantity = params?.quantity || user.quantity || 20;
  const crop = DB.CROPS.find(c=>c.id===cropId);
  const r = DB.recommendationEngine(cropId);
  const [explainOpen, setExplainOpen] = React.useState(false);
  const mandisSorted = [...DB.MANDIS].map(m=>({...m, price: DB.mandiPriceFor(cropId,m)})).sort((a,b)=>b.price-a.price);
  const diffTotal = r.diffPerUnit*quantity;
  const label = r.recommendation==='WAIT'?'WAIT':r.recommendation==='SELL_NOW'?'SELL NOW':'COMPARE MANDIS';
  const tone = r.recommendation==='WAIT'?'text-amber-600 bg-amber-100':r.recommendation==='SELL_NOW'?'text-forest-700 bg-forest-100':'text-ink-700 bg-ink-900/5';

  return (
    <div className="h-full flex flex-col">
      <TopBar title={t('yourSellingRecommendation')} onBack={()=>setView('home')} />
      <div className="flex-1 scroll-area px-5 py-4 pb-8">
        <Card className="flex items-center justify-between">
          <div><div className="font-extrabold text-ink-900">{crop.name}</div><div className="text-xs text-ink-500">{quantity} Quintals</div></div>
          <Icon name="package" size={22} className="text-forest-700"/>
        </Card>

        <div className="mt-5">
          <div className="text-xs font-extrabold text-ink-500 tracking-wide mb-2">{t('nearbyMandis')}</div>
          <div className="space-y-2.5">
            {mandisSorted.map((m,i)=>(
              <Card key={m.id} className={`flex items-center justify-between ${i===0?'border-2 border-forest-700/20':''}`}>
                <div>
                  <div className="font-bold text-ink-900 text-sm">{m.name}</div>
                  <div className="text-xs text-ink-500 mt-0.5">{m.distanceKm} km away</div>
                </div>
                <div className="text-right">
                  <div className="font-extrabold text-ink-900">₹{m.price.toLocaleString('en-IN')}/q</div>
                  <div className={`flex items-center gap-1 justify-end text-xs font-bold ${m.trend>=0?'text-forest-600':'text-red-600'}`}><Icon name={m.trend>=0?'trendUp':'trendDown'} size={11}/>{m.trend>=0?'+':''}{m.trend}%</div>
                </div>
                {i===0 && <div className="absolute"></div>}
              </Card>
            ))}
            {mandisSorted[0] && <div className="text-right"><Badge tone="good">{t('bestPrice')}</Badge></div>}
          </div>
        </div>

        <div className="mt-6">
          <div className="text-xs font-extrabold text-ink-500 tracking-wide mb-2">LINKATRIX RECOMMENDATION</div>
          <Card className="!p-5 text-center border-2 border-forest-700/10">
            <div className={`inline-block px-4 py-1.5 rounded-full font-extrabold text-xl ${tone}`}>{label}</div>
            <p className="text-sm text-ink-500 mt-3 leading-relaxed">
              {r.recommendation==='WAIT' && 'Recent market prices show an upward trend. Based on historical price movement, waiting may provide a better expected price.'}
              {r.recommendation==='SELL_NOW' && 'Recent market prices show a downward trend. Selling soon may help avoid further price drops.'}
              {r.recommendation==='COMPARE_MANDIS' && 'Price movement is mixed — comparing nearby mandis may offer a better outcome than waiting or selling immediately.'}
            </p>
            <div className="grid grid-cols-3 gap-2 mt-4 text-center">
              <div><div className="text-[11px] text-ink-300">Current</div><div className="font-extrabold text-ink-900 text-sm">₹{r.current}/q</div></div>
              <div><div className="text-[11px] text-ink-300">Expected</div><div className="font-extrabold text-ink-900 text-sm">₹{r.expected}/q</div></div>
              <div><div className="text-[11px] text-ink-300">Difference</div><div className={`font-extrabold text-sm ${r.diffPerUnit>=0?'text-forest-700':'text-red-600'}`}>{r.diffPerUnit>=0?'+':''}₹{r.diffPerUnit}/q</div></div>
            </div>
            <div className="mt-3 pt-3 border-t border-ink-900/[0.06] text-sm">
              For {quantity} quintals: <span className={`font-extrabold ${diffTotal>=0?'text-forest-700':'text-red-600'}`}>{diffTotal>=0?'+':''}₹{diffTotal.toLocaleString('en-IN')}</span>
            </div>
            <button onClick={()=>setExplainOpen(true)} className="text-forest-700 font-bold text-sm mt-4">Why are we recommending {label}?</button>
            <div className="text-[11px] text-ink-300 mt-3 flex items-center justify-center gap-1.5"><Icon name="info" size={12}/> Profit is never guaranteed — this is a rule-based estimate.</div>
          </Card>
        </div>

        <div className="flex gap-3 mt-5">
          <Button variant="outline" className="flex-1" onClick={()=>setView('buyers')}>{t('recommendedBuyers')}</Button>
          <Button className="flex-1" onClick={()=>setView('price',{crop:cropId})}>{t('priceTrend')}</Button>
        </div>
        <DataSourcesFooter />
      </div>
      <ExplainSheet open={explainOpen} onClose={()=>setExplainOpen(false)} r={r} />
    </div>
  );
}
</script>

function BrowseListingsScreen({ setView }){
  const DB = window.LINKATRIX;

  const [query, setQuery] = React.useState('');
  const listings = DB.FARMER_LISTINGS.filter(l=>{
    const crop = DB.CROPS.find(c=>c.id===l.cropId);
    const matchesQuery = !query || crop.name.toLowerCase().includes(query.toLowerCase()) || l.farmer.toLowerCase().includes(query.toLowerCase());
    return (cropFilter==='all'||l.cropId===cropFilter) && (qualityFilter==='all'||l.quality===qualityFilter) && matchesQuery;
  });
  return (
    <div className="h-full flex flex-col">
      <TopBar title={t('browseListings')} />
      <div className="flex-1 scroll-area px-5 py-4 pb-8">

            <option value="all">All Crops</option>
            {DB.CROPS.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}

          <select value={qualityFilter} onChange={e=>setQualityFilter(e.target.value)} className="px-3 py-2 rounded-full bg-white border border-ink-900/10 text-xs font-bold text-ink-700">

        </div>
        <div className="mt-4 space-y-3">

              <Card key={l.id} onClick={()=>setView('listing-detail',{listingId:l.id})}>

function MakeOfferSheet({ open, onClose, listing, onSubmit }){
  const DB = window.LINKATRIX;
  const [price, setPrice] = React.useState(listing?.expectedPrice||'');

  if(!listing) return null;
  return (
    <BottomSheet open={open} onClose={onClose} title="Make an Offer">
      <div className="text-sm text-ink-500 mb-4">Farmer's expected price: <b className="text-ink-900">₹{listing.expectedPrice}/{listing.unit}</b></div>
      <label className="text-xs font-bold text-ink-500">Your Offer (₹/{listing.unit})</label>
      <input type="number" value={price} onChange={e=>setPrice(e.target.value)} className="w-full mt-1 mb-4 px-4 py-3 rounded-2xl border border-ink-900/10 bg-white text-[15px]" />
      <Button className="w-full" size="lg" onClick={()=>onSubmit(price)}>Send Offer <Icon name="send" size={15}/></Button>

  );
}

        </Card>

        <Card className="mt-4">

          <div className="grid grid-cols-3 gap-2 text-center">

          </div>

</script>
<script type="text/babel" data-presets="react">

</script>
<script type="text/babel" data-presets="react">
// ==========================================================================
// ROOT APP
// ==========================================================================
function AuthedShell({ user, setUser, onLogout }){
  const [view, setViewRaw] = React.useState('home');
  const [params, setParams] = React.useState(null);
  const [stack, setStack] = React.useState(['home']);
  const [online, setOnline] = React.useState(true);
  const [lang, setLang] = React.useState('en');

  const setView = (v, p) => {
    setViewRaw(v); setParams(p||null);
    setStack(s => [...s, v]);
  };

  const isBuyer = user.role === 'BUYER';
  const bottomTabs = isBuyer ? ['home','price','browse','offers','knowledge'] : ['home','price','add','buyers','knowledge'];

  const screens = {
    home: isBuyer ? <BuyerHome user={user} setView={setView} online={online} /> : <FarmerHome user={user} setView={setView} online={online} />,
    price: <PriceTrendScreen setView={setView} params={params} online={online} />,
    add: <AddCropScreen setView={setView} user={user} />,
    'add-success': <AddCropSuccessScreen setView={setView} params={params} />,
    recommendation: <RecommendationScreen setView={setView} params={params} user={user} />,
    buyers: <BuyersScreen setView={setView} />,
    'buyer-profile': <BuyerProfileScreen setView={setView} params={params} />,
    browse: <BrowseListingsScreen setView={setView} />,
    'listing-detail': <ListingDetailScreen setView={setView} params={params} />,
    offers: <MyOffersScreen setView={setView} />,
    knowledge: <KnowledgeHubScreen setView={setView} />,
    'knowledge-article': <KnowledgeArticleScreen setView={setView} params={params} />,
    'what-to-grow': <WhatToGrowScreen setView={setView} />,
    'after-harvest': <AfterHarvestScreen setView={setView} />,
    weather: <WeatherScreen setView={setView} />,
    profile: <ProfileScreen user={user} setView={setView} onLogout={onLogout} lang={lang} setLang={setLang} />,
  };

  return (
    <LangCtx.Provider value={{ lang, setLang }}>
      <div className="absolute inset-0 flex flex-col">
        <div className="flex-1 relative overflow-hidden">
          {screens[view] || screens.home}
        </div>
        <BottomNav active={view} setView={setView} role={user.role} />
      </div>
    </LangCtx.Provider>
  );
}

function Root(){
  const [stage, setStage] = React.useState('splash'); // splash | login | register | location | app
  const [user, setUser] = React.useState(null);
  const [toasts, setToasts] = React.useState([]);
  const [lang, setLang] = React.useState('en');

  const handleLogin = (account) => { setUser(account); setStage('location'); };
  const handleRegistered = (account) => { setUser(account); setStage('location'); };
  const handleLocationDone = (loc) => { setUser(u=>({...u, ...loc})); setStage('app'); };
  const handleLogout = () => { setUser(null); setStage('login'); };

  return (
    <AppCtx.Provider value={{ toasts, setToasts }}>
      <LangCtx.Provider value={{ lang, setLang }}>
        <div className="phone-shell overflow-hidden">
          {stage==='splash' && <SplashScreen onDone={()=>setStage('login')} />}
          {stage==='login' && <LoginScreen onLogin={handleLogin} goRegister={()=>setStage('register')} />}
          {stage==='register' && <RegisterScreen onBack={()=>setStage('login')} onRegistered={handleRegistered} />}
          {stage==='location' && <LocationSetupScreen onDone={handleLocationDone} />}
          {stage==='app' && user && <AuthedShell user={user} setUser={setUser} onLogout={handleLogout} />}
          <ToastHost />
        </div>
      </LangCtx.Provider>
    </AppCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
